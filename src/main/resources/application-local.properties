# DynamoDB Local
spring.config.import=optional:classpath:application-secrets.properties

aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.access-key=dummy
aws.dynamodb.secret-key=dummy

# Verbose logging when debugging locally
logging.level.software.amazon.awssdk.enhanced.dynamodb=DEBUG

# Allow HTTP in dev
server.servlet.session.cookie.secure=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.forward-headers-strategy=framework
# Spring framework internals (bean creation, context startup, etc.)
logging.level.org.springframework=DEBUG

# Web layer: request mapping, dispatching, handler resolution
logging.level.org.springframework.web=TRACE

# Security filter chain (if using Spring Security)
logging.level.org.springframework.security=TRACE

# Transactions: when they open, commit, rollback
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# Hibernate/JPA: actual SQL + bound parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# (for Hibernate 5.x / older Spring Boot 2.x use this instead:)
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Embedded Tomcat
logging.level.org.apache.tomcat=DEBUG
logging.level.org.apache.catalina=DEBUG

# application code
logging.level.dev.hope.vulcaobackend=TRACE

logging.file.name=logs/app-full.log
logging.logback.rollingpolicy.max-file-size=100MB


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${spring.mail.username}
spring.mail.password=${spring.mail.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true