spring.application.name=vulcao-backend
aws.dynamodb.endpoint=
aws.dynamodb.region=eu-south-2
logging.file.name=/var/log/vulcao-backend.log

logging.level.software.amazon.awssdk.enhanced.dynamodb.beans=DEBUG
logging.level.software.amazon.awssdk.enhanced.dynamodb.mapper=DEBUG
logging.level.software.amazon.awssdk.enhanced.dynamodb=INFO
# application.properties (or application-production.properties)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

SPRING_PROFILES_ACTIVE=prod



# Your own app logging (everything under your package shows DEBUG)
logging.level.dev.hope.vulcaobackend=DEBUG

# Spring's pre-built request logging (alternative to the custom filter)
spring.mvc.log-resolved-exception=true

aws.s3.bucket=vulcao-app-artifacts
aws.s3.region=eu-south-2

server.forward-headers-strategy=framework
# Spring framework internals (bean creation, context startup, etc.)
logging.level.org.springframework=DEBUG

# Web layer: request mapping, dispatching, handler resolution
logging.level.org.springframework.web=TRACE

# Security filter chain (if using Spring Security)
logging.level.org.springframework.security=TRACE

# Transactions: when they open, commit, rollback
logging.level.org.springframework.transaction=TRACE

# (for Hibernate 5.x / older Spring Boot 2.x use this instead:)
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Embedded Tomcat
logging.level.org.apache.tomcat=DEBUG
logging.level.org.apache.catalina=DEBUG



# Log full request/response details in the web layer
spring.mvc.log-request-details=true

# Show why auto-configurations were applied or skipped (very educational!)
debug=true


# Show the auto-config condition evaluation report on startup
logging.level.org.springframework.boot.autoconfigure=DEBUG

