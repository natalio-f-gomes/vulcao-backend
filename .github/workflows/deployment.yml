name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:

  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_KEY: builds/${{ github.sha }}.zip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Package deployment bundle
        run: |
          mkdir -p deploy/scripts
          cp target/*.jar deploy/app.jar
          cp appspec.yml deploy/appspec.yml
          cp scripts/*.sh deploy/scripts/
          # Strip Windows line endings, just in case
          sed -i 's/\r$//' deploy/scripts/*.sh deploy/appspec.yml
          chmod +x deploy/scripts/*.sh
          cd deploy && zip -r ../bundle.zip .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secrets
        env:
          BUCKET: ${{ env.S3_BUCKET }}
          ROLE: ${{ secrets.AWS_DEPLOY_ARN }}
        run: |
          [ -n "$BUCKET" ] || { echo "S3_BUCKET missing"; exit 1; }
          [ -n "$ROLE" ] || { echo "AWS_DEPLOY_ROLE_ARN missing"; exit 1; }
          echo "All required values present"

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-00006eba4f6dd4b02 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/vulcao-backend && git pull "]' \
            --output text