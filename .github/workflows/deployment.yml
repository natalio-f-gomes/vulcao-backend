name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-south-2
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_KEY: builds/${{ github.sha }}.zip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests


      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secrets
        env:
          BUCKET: ${{ env.S3_BUCKET }}
          ROLE: ${{ secrets.AWS_DEPLOY_ARN }}
        run: |
          [ -n "$BUCKET" ] || { echo "S3_BUCKET missing"; exit 1; }
          [ -n "$ROLE" ] || { echo "AWS_DEPLOY_ROLE_ARN missing"; exit 1; }
          echo "All required values present"

      - name: Upload JAR to S3
        run: aws s3 cp target/*.jar s3://${{ secrets.S3_BUCKET }}/app.jar
