name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-south-2
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_KEY: builds/${{ github.sha }}.zip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests


      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secrets
        env:
          BUCKET: ${{ env.S3_BUCKET }}
          ROLE: ${{ secrets.AWS_DEPLOY_ARN }}
        run: |
          [ -n "$BUCKET" ] || { echo "S3_BUCKET missing"; exit 1; }
          [ -n "$ROLE" ] || { echo "AWS_DEPLOY_ROLE_ARN missing"; exit 1; }
          echo "All required values present"

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --region eu-south-2 \
            --instance-ids i-00006eba4f6dd4b02 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ec2-user/vulcao-backend",
              "git pull",
              "./mvnw clean package -DskipTests",
              "sudo systemctl restart vulcao-backend"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "Command ID: $CMD_ID"

          # Wait but don't fail yet
          aws ssm wait command-executed \
            --region eu-south-2 \
            --command-id $CMD_ID \
            --instance-id i-00006eba4f6dd4b02 || WAIT_FAILED=1

          # ALWAYS print output regardless
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --region eu-south-2 \
            --command-id $CMD_ID \
            --instance-id i-00006eba4f6dd4b02 \
            --query 'StandardOutputContent' --output text

          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --region eu-south-2 \
            --command-id $CMD_ID \
            --instance-id i-00006eba4f6dd4b02 \
            --query 'StandardErrorContent' --output text

          # NOW fail the workflow if needed
          if [ -n "$WAIT_FAILED" ]; then
            echo "Deploy failed"
            exit 1
          fi