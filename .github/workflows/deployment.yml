name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-south-2
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_KEY: builds/${{ github.sha }}.zip
  CODEDEPLOY_APP: vulcao-code-deploy          # CodeDeploy application name
  CODEDEPLOY_GROUP: vulcao-development-environment     # Deployment group name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment bundle
        run: |
          mkdir -p bundle/scripts
          cp target/*.jar bundle/app.jar
          cp appspec.yml bundle/appspec.yml
          cp scripts/*.sh bundle/scripts/
          # Normalize line endings + ensure executable
          sed -i 's/\r$//' bundle/scripts/*.sh bundle/appspec.yml
          chmod +x bundle/scripts/*.sh
          cd bundle && zip -r ../bundle.zip .

      - name: Upload bundle to S3
        run: aws s3 cp bundle.zip s3://${{ env.S3_BUCKET }}/${{ env.S3_KEY }}

      - name: Trigger CodeDeploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ env.S3_BUCKET }},key=${{ env.S3_KEY }},bundleType=zip \
            --description "Deploy ${{ github.sha }}" \
            --query 'deploymentId' --output text)
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Wait for deployment to complete
        run: |
          aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID || {
            echo "Deployment failed. Fetching details..."
            aws deploy get-deployment --deployment-id $DEPLOYMENT_ID \
              --query 'deploymentInfo.{
                Status:status,
                ErrorInfo:errorInformation,
                Summary:deploymentOverview
              }'
            exit 1
          }
          echo "Deployment successful"